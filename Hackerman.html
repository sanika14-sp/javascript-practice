<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Hackerman</title>
    </head>
    <style>
     body {
        background-color: black;
     color:rgb(70 255 50);
     font-size: 15px;
     padding-top: 20px;
     padding-left:20px;
     font-family: 'Courier New', Courier, monospace;
     }

     #code {
       color: #00ff00;
       text-shadow: 0 0 5px #00ff00,
                    0 0 10px #00ff00;
                    
     }
     .cursor{
         animation: blink 1s infinite;
        }

      @keyframes blink{
         50%{
              opacity: 0;
         }
        }

     
    
    </style>
    <body>
        <div id="code"></div>
        <span class="cursor">|</span>
        <script src="Hackerman.js"></script>
    </body>
</html>
