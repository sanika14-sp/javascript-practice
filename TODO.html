<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO list </title>
</head>
<body>
    <h2>TO-DO LIST</h2>
   <div id="input">
      <input type="text" id="input_box"><br>
      <button id="input_btn" onclick="Create_todo()">Create To-Do</button>
   </div><br>

     <div id="delete">
      <input type="number" id="delete_task" placeholder="Enter the number of task">
      <button id="delete_btn" onclick="Delete_todo()" >Delete To-Do</button>
   </div><br>

   <div id="display">
      <h4>All Tasks</h4>
      <p> </p>
   </div><br>
   
   <script src="TODO.js"></script>
</body>
</html>
