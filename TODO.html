<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO list </title>
</head>
<style>
   body{
      background-color: rgb(220, 118, 220);
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
   }
   
   input{
      background-color: white;
      border-radius: 20px;
      font-size: 20px;
   }

   button{
      border-radius: 15px;
      font-size: 15px;
      background-color: rgb(169, 66, 200);
   }

   #display{
      background-color: white;
      width :200px;
      padding-left:10px;
      padding-top: 3px;
      padding-bottom :3px;
      border-radius: 20px;
      font-size: 20px;
   }

</style>

<body>
    <h1 align="center">TO-DO LIST</h1>
   <div id="input">
      <input type="text" id="input_box">
      <button id="input_btn" onclick="Create_todo()">Create</button>
   </div><br>

     <div id="delete">
      <input type="number" id="delete_task" placeholder=" Enter the number of task ">
      <button id="delete_btn" onclick="Delete_todo()" >Delete</button>
   </div><br>

   <div id="display">
      <h4>All Tasks</h4>
      <p> </p>
   </div><br>

   <script src="TODO.js"></script>
</body>
</html>
